<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section-title {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .task-list {
            background: #f8f9fa;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .task-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task-info {
            flex: 1;
        }
        
        .task-info h3 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .task-info p {
            color: #666;
            font-size: 0.9em;
            margin: 3px 0;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .task-actions button {
            padding: 8px 15px;
            font-size: 0.9em;
            margin-right: 0;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: #f8f9fa;
            border-radius: 5px;
            padding: 20px;
            border: 1px solid #ddd;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        
        .status-in-progress {
            background: #cfe2ff;
            color: #084298;
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        
        .success {
            color: #155724;
            background: #d4edda;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Assignment Management System</h1>
        
        <div id="messageArea"></div>
        
        <!-- Create Assignment Section -->
        <div class="section">
            <div class="section-title">➕ Create New Assignment</div>
            <form id="createAssignmentForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title *</label>
                    <input type="text" id="taskTitle" name="taskTitle" placeholder="Enter task title" required>
                </div>
                
                <div class="grid">
                    <div class="form-group">
                        <label for="taskCategory">Category *</label>
                        <select id="taskCategory" name="taskCategory" required>
                            <option value="">Select a category</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDepartment">Department *</label>
                        <select id="taskDepartment" name="taskDepartment" required>
                            <option value="">Select a department</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid">
                    <div class="form-group">
                        <label for="taskAssignee">Assigned To *</label>
                        <input type="email" id="taskAssignee" name="taskAssignee" placeholder="assignee@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDueDate">Due Date *</label>
                        <input type="date" id="taskDueDate" name="taskDueDate" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" name="taskDescription" placeholder="Enter task description..."></textarea>
                </div>
                
                <button type="submit">Create Assignment</button>
                <div class="loading" id="createLoading">
                    <div class="spinner"></div>
                    Creating assignment...
                </div>
            </form>
        </div>
        
        <!-- View Assignments Section -->
        <div class="section">
            <div class="section-title">📊 Your Assignments</div>
            <button onclick="loadTasks()">Refresh Assignments</button>
            <div class="loading" id="loadingTasks">
                <div class="spinner"></div>
                Loading assignments...
            </div>
            <div class="task-list" id="taskList">
                <p style="color: #999; text-align: center;">Click "Refresh Assignments" to load your tasks</p>
            </div>
        </div>
    </div>

    <script>
        // API Routes Configuration
        const API_ROUTES = {
            getTasks: {
                id: 'id-ep-101',
                endpoint: 'https://defaultca6a4b3f912349bcbcb927085ebbf1.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/37642ba3597f4cf58288cc71b5e6b519/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hklOSh62A6jmQuhX28NYQMaxlVEG8fC05LVsyVz7YX4'
            },
            createTask: {
                id: 'id-ep-6',
                endpoint: 'https://defaultca6a4b3f912349bcbcb927085ebbf1.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f71397ff3ca145059dc8f78c04923e9f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=q8RUKhOTNluCpoKgid215iBsXVuY3H_l3FjAPxw2NJ0'
            },
            getDepartments: {
                id: 'id-ep-108',
                endpoint: 'https://defaultca6a4b3f912349bcbcb927085ebbf1.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3c7094de10ce473e985e5cadcf66bc67/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=EGbfe4BGaIRpq1CR-atEpF9_i8kX4yGbedQueJQdGjo'
            },
            getCategories: {
                id: 'id-ep-105',
                endpoint: 'https://defaultca6a4b3f912349bcbcb927085ebbf1.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9df45c5086ea42f2ab2b6ee9afae3f29/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=fGsqxEnBnrjdOm7CWre6485XfuJsdW_GxMCblmY0gFQ'
            },
            sendNotification: {
                id: 'id-ep-4',
                endpoint: 'https://defaultca6a4b3f912349bcbcb927085ebbf1.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2e37b6310842410eb15c4561f2b0c1eb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=JWa3c_EuUTSNguAGK05GF3arABlaeKANnoFn5tCV4qQ'
            }
        };

        // Message Display Helper
        function showMessage(message, type = 'info') {
            const messageArea = document.getElementById('messageArea');
            const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : 'error');
            messageArea.innerHTML = `<div class="${className}">${message}</div>`;
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }

        // Load Categories
        async function loadCategories() {
            try {
                const response = await fetch(API_ROUTES.getCategories.endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                const categorySelect = document.getElementById('taskCategory');
                
                if (Array.isArray(data)) {
                    data.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category.id || category.name;
                        option.textContent = category.name;
                        categorySelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading categories:', error);
                showMessage('Failed to load categories', 'error');
            }
        }

        // Load Departments
        async function loadDepartments() {
            try {
                const response = await fetch(API_ROUTES.getDepartments.endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                const departmentSelect = document.getElementById('taskDepartment');
                
                if (Array.isArray(data)) {
                    data.forEach(department => {
                        const option = document.createElement('option');
                        option.value = department.id || department.name;
                        option.textContent = department.name;
                        departmentSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading departments:', error);
                showMessage('Failed to load departments', 'error');
            }
        }

        // Load Tasks
        async function loadTasks() {
            const loadingElement = document.getElementById('loadingTasks');
            const taskList = document.getElementById('taskList');
            
            loadingElement.style.display = 'block';
            taskList.innerHTML = '';
            
            try {
                const response = await fetch(API_ROUTES.getTasks.endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const tasks = await response.json();
                
                if (Array.isArray(tasks) && tasks.length > 0) {
                    taskList.innerHTML = tasks.map(task => `
                        <div class="task-item">
                            <div class="task-info">
                                <h3>${task.title || 'Untitled Task'}</h3>
                                <p><strong>Assigned to:</strong> ${task.assignedTo || 'N/A'}</p>
                                <p><strong>Department:</strong> ${task.department || 'N/A'}</p>
                                <p><strong>Category:</strong> ${task.category || 'N/A'}</p>
                                <p><strong>Due Date:</strong> ${task.dueDate || 'N/A'}</p>
                                <p><strong>Status:</strong> <span class="status-badge status-${task.status?.toLowerCase() || 'pending'}">${task.status || 'Pending'}</span></p>
                            </div>
                            <div class="task-actions">
                                <button onclick="editTask('${task.id}')">Edit</button>
                                <button onclick="deleteTask('${task.id}')" style="background: #dc3545;">Delete</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    taskList.innerHTML = '<p style="color: #999; text-align: center;">No assignments found</p>';
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
                taskList.innerHTML = '<div class="error">Failed to load assignments. Please try again.</div>';
            } finally {
                loadingElement.style.display = 'none';
            }
        }

        // Create Task Form Handler
        document.getElementById('createAssignmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loading = document.getElementById('createLoading');
            loading.style.display = 'block';
            
            const taskData = {
                title: document.getElementById('taskTitle').value,
                category: document.getElementById('taskCategory').value,
                department: document.getElementById('taskDepartment').value,
                assignedTo: document.getElementById('taskAssignee').value,
                dueDate: document.getElementById('taskDueDate').value,
                description: document.getElementById('taskDescription').value,
                status: 'Pending'
            };
            
            try {
                const response = await fetch(API_ROUTES.createTask.endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(taskData)
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                showMessage('Assignment created successfully!', 'success');
                document.getElementById('createAssignmentForm').reset();
                
                // Send notification
                await fetch(API_ROUTES.sendNotification.endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipientEmail: taskData.assignedTo,
                        subject: `New Assignment: ${taskData.title}`,
                        message: `You have been assigned a new task: ${taskData.title}`
                    })
                }).catch(err => console.error('Notification failed:', err));
                
                // Reload tasks
                setTimeout(loadTasks, 1000);
            } catch (error) {
                console.error('Error creating task:', error);
                showMessage('Failed to create assignment. Please try again.', 'error');
            } finally {
                loading.style.display = 'none';
            }
        });

        // Edit Task
        function editTask(taskId) {
            showMessage('Edit functionality coming soon', 'info');
        }

        // Delete Task
        function deleteTask(taskId) {
            if (confirm('Are you sure you want to delete this assignment?')) {
                showMessage('Delete functionality coming soon', 'info');
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadDepartments();
        });
    </script>
</body>
</html>
