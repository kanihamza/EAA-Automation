<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Launchpad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white mb-2">My Network</h1>
                <p class="text-gray-400">Central hub for all deployed terminals and apps.</p>
            </div>
            <div class="text-sm bg-gray-800 px-3 py-1 rounded-full text-blue-400 border border-gray-700">
                <span id="domain-count">0</span> Domains Active
            </div>
        </header>

        <!-- Search -->
        <div class="relative mb-6">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 w-5 h-5"></i>
            <input type="text" id="search" placeholder="Filter domains..." class="w-full bg-gray-800 border border-gray-700 rounded-lg py-3 pl-10 pr-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-500">
        </div>

        <!-- Grid -->
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Cards injected via JS -->
        </div>
    </div>

    <script>
        const domains = [
            "advanced.infinityfreeapp.com",
            "dgo.fwh.is",
            "dgoterminal.gt.tc",
            "digiserve.page.gd",
            "digitalglass.page.gd",
            "directhub.page.gd",
            "doce.free.nf",
            "eaa.page.gd",
            "eaaterminal.xo.je",
            "internal.page.gd",
            "multipage.ct.ws",
            "taskshub.free.nf",
            "terminal.fast-page.org",
            "webapp.page.gd"
        ];

        const grid = document.getElementById('grid');
        const countLabel = document.getElementById('domain-count');
        const searchInput = document.getElementById('search');

        function render(filter = "") {
            grid.innerHTML = "";
            const filtered = domains.filter(d => d.toLowerCase().includes(filter.toLowerCase()));
            countLabel.textContent = filtered.length;

            filtered.forEach(domain => {
                const url = `https://${domain}`;
                const card = document.createElement('div');
                card.className = "bg-gray-800 border border-gray-700 rounded-xl p-5 hover:border-blue-500 hover:shadow-lg hover:shadow-blue-500/10 transition-all group";
                
                // Extract subdomain for visual label
                const parts = domain.split('.');
                const mainName = parts[0].toUpperCase();
                const ext = parts.slice(1).join('.');

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="bg-gray-700 p-2 rounded-lg text-blue-400 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                            <i data-lucide="globe" class="w-6 h-6"></i>
                        </div>
                        <button onclick="copyToClipboard('${url}')" class="text-gray-500 hover:text-white p-1 rounded hover:bg-gray-700 transition-colors" title="Copy URL">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <h3 class="font-bold text-lg text-white mb-1 truncate" title="${mainName}">${mainName}</h3>
                    <p class="text-xs text-gray-500 font-mono mb-4 truncate">${ext}</p>
                    
                    <a href="${url}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-gray-900 hover:bg-blue-600 border border-gray-700 hover:border-blue-500 text-gray-300 hover:text-white py-2 rounded-lg text-sm font-medium transition-all">
                        <span>Launch</span>
                        <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Visual feedback could go here
                alert("Copied: " + text);
            });
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));

        // Initial render
        lucide.createIcons();
        render();
    </script>
</body>
</html>
