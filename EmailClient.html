<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Client - EAA Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 90vh;
        }

        /* Sidebar */
        .sidebar {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 20px;
            overflow-y: auto;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-section {
            margin-bottom: 30px;
        }

        .nav-section-title {
            font-size: 12px;
            color: #bdc3c7;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-left-color: #667eea;
        }

        .nav-item.active {
            background: #667eea;
            border-left-color: #667eea;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Compose Form */
        .compose-section {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 200px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Email List */
        .email-list {
            margin-top: 20px;
        }

        .email-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            gap: 15px;
            align-items: center;
        }

        .email-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .email-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .email-content h3 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .email-content p {
            color: #7f8c8d;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .email-date {
            color: #95a5a6;
            font-size: 12px;
            text-align: right;
        }

        /* Status Messages */
        .status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .close-btn {
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: #000;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .email-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">📧 Email Client</div>
            
            <div class="nav-section">
                <div class="nav-section-title">Mail</div>
                <div class="nav-item active" onclick="switchTab('compose')">✏️ Compose</div>
                <div class="nav-item" onclick="switchTab('inbox')">📥 Inbox</div>
                <div class="nav-item" onclick="switchTab('sent')">📤 Sent</div>
                <div class="nav-item" onclick="switchTab('drafts')">📝 Drafts</div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Settings</div>
                <div class="nav-item" onclick="openSettings()">⚙️ Configuration</div>
                <div class="nav-item" onclick="testConnection()">🔗 Test Connection</div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <header class="header">
                <h1>Email Management</h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="refreshData()">🔄 Refresh</button>
                    <button class="btn btn-primary" onclick="switchTab('compose')">+ New Email</button>
                </div>
            </header>

            <div class="content-area">
                <div id="statusMessage" class="status-message"></div>

                <!-- Compose Tab -->
                <div id="compose" class="tab-content active">
                    <div class="compose-section">
                        <h2 style="margin-bottom: 20px; color: #2c3e50;">Create New Email</h2>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="recipientEmail">Recipient Email *</label>
                                <input type="email" id="recipientEmail" placeholder="recipient@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="ccEmail">CC (Optional)</label>
                                <input type="email" id="ccEmail" placeholder="cc@example.com">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="bccEmail">BCC (Optional)</label>
                                <input type="email" id="bccEmail" placeholder="bcc@example.com">
                            </div>
                            <div class="form-group">
                                <label for="emailSubject">Subject *</label>
                                <input type="text" id="emailSubject" placeholder="Email subject" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="emailBody">Message Body *</label>
                            <textarea id="emailBody" placeholder="Write your email message here..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="priority">Priority Level</label>
                            <select id="priority">
                                <option value="Normal">Normal</option>
                                <option value="High">High</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="template">Email Template (Optional)</label>
                            <select id="template">
                                <option value="">-- Select Template --</option>
                                <option value="greeting">Greeting Template</option>
                                <option value="followup">Follow-up Template</option>
                                <option value="notification">Notification Template</option>
                                <option value="report">Report Template</option>
                            </select>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-primary" onclick="sendEmail()">
                                <span id="sendBtnText">📧 Send Email</span>
                                <span id="sendSpinner" class="spinner" style="display: none;"></span>
                            </button>
                            <button class="btn btn-secondary" onclick="saveDraft()">💾 Save as Draft</button>
                            <button class="btn btn-secondary" onclick="clearForm()">🗑️ Clear</button>
                        </div>
                    </div>
                </div>

                <!-- Inbox Tab -->
                <div id="inbox" class="tab-content">
                    <h2 style="margin-bottom: 20px; color: #2c3e50;">Inbox</h2>
                    <div class="tabs">
                        <button class="tab active" onclick="filterEmails('all')">All</button>
                        <button class="tab" onclick="filterEmails('unread')">Unread</button>
                        <button class="tab" onclick="filterEmails('flagged')">Flagged</button>
                    </div>
                    <div id="emailList" class="email-list">
                        <div style="color: #7f8c8d; padding: 20px; text-align: center;">
                            Load your inbox to view emails
                        </div>
                    </div>
                </div>

                <!-- Sent Tab -->
                <div id="sent" class="tab-content">
                    <h2 style="margin-bottom: 20px; color: #2c3e50;">Sent Emails</h2>
                    <div id="sentList" class="email-list">
                        <div style="color: #7f8c8d; padding: 20px; text-align: center;">
                            Sent emails will appear here
                        </div>
                    </div>
                </div>

                <!-- Drafts Tab -->
                <div id="drafts" class="tab-content">
                    <h2 style="margin-bottom: 20px; color: #2c3e50;">Drafts</h2>
                    <div id="draftsList" class="email-list">
                        <div style="color: #7f8c8d; padding: 20px; text-align: center;">
                            No drafts saved yet
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Power Automate Configuration</h2>
                <button class="close-btn" onclick="closeModal('settingsModal')">&times;</button>
            </div>
            
            <div class="form-group">
                <label for="webhookUrl">Power Automate Webhook URL *</label>
                <input type="url" id="webhookUrl" placeholder="https://prod-xxx.execute-api.region.amazonaws.com/triggers/..." required>
            </div>

            <div class="form-group">
                <label for="apiKey">API Key (if required)</label>
                <input type="password" id="apiKey" placeholder="Your API key">
            </div>

            <div class="form-group">
                <label for="senderEmail">Sender Email Address *</label>
                <input type="email" id="senderEmail" placeholder="sender@example.com" required>
            </div>

            <div class="form-group">
                <label for="timeout">Request Timeout (seconds)</label>
                <input type="number" id="timeout" value="30" min="5" max="300">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="saveConfiguration()">💾 Save Configuration</button>
                <button class="btn btn-secondary" onclick="closeModal('settingsModal')">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration Storage
        const CONFIG_KEY = 'emailClientConfig';
        const DRAFTS_KEY = 'emailDrafts';
        const SENT_KEY = 'sentEmails';

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadConfiguration();
            loadDrafts();
            loadSentEmails();
        });

        // Switch between tabs
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            const selectedTab = document.getElementById(tabName);
            if (selectedTab) {
                selectedTab.classList.add('active');
            }

            // Update navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Show status message
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            
            if (type !== 'error') {
                setTimeout(() => {
                    statusEl.className = 'status-message';
                }, 5000);
            }
        }

        // Send Email via Power Automate
        async function sendEmail() {
            const config = loadConfiguration();
            
            if (!config.webhookUrl) {
                showStatus('⚠️ Please configure Power Automate webhook URL first', 'error');
                openSettings();
                return;
            }

            const recipientEmail = document.getElementById('recipientEmail').value.trim();
            const emailSubject = document.getElementById('emailSubject').value.trim();
            const emailBody = document.getElementById('emailBody').value.trim();
            const ccEmail = document.getElementById('ccEmail').value.trim();
            const bccEmail = document.getElementById('bccEmail').value.trim();
            const priority = document.getElementById('priority').value;

            // Validation
            if (!recipientEmail || !emailSubject || !emailBody) {
                showStatus('❌ Please fill in required fields (Recipient, Subject, Body)', 'error');
                return;
            }

            // Show loading state
            const sendBtn = document.querySelector('[onclick="sendEmail()"]');
            document.getElementById('sendBtnText').style.display = 'none';
            document.getElementById('sendSpinner').style.display = 'inline-block';
            sendBtn.disabled = true;

            try {
                const payload = {
                    to: recipientEmail,
                    cc: ccEmail || undefined,
                    bcc: bccEmail || undefined,
                    subject: emailSubject,
                    body: emailBody,
                    priority: priority,
                    senderEmail: config.senderEmail,
                    timestamp: new Date().toISOString(),
                    source: 'EmailClient'
                };

                // Remove undefined values
                Object.keys(payload).forEach(key => payload[key] === undefined && delete payload[key]);

                const response = await fetch(config.webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(config.apiKey && { 'Authorization': `Bearer ${config.apiKey}` })
                    },
                    body: JSON.stringify(payload),
                    timeout: config.timeout * 1000
                });

                if (response.ok) {
                    showStatus('✅ Email sent successfully via Power Automate!', 'success');
                    addToSentEmails({
                        to: recipientEmail,
                        subject: emailSubject,
                        body: emailBody,
                        timestamp: new Date().toISOString()
                    });
                    clearForm();
                } else {
                    showStatus(`❌ Failed to send email: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Error sending email: ${error.message}`, 'error');
                console.error('Email send error:', error);
            } finally {
                document.getElementById('sendBtnText').style.display = 'inline';
                document.getElementById('sendSpinner').style.display = 'none';
                sendBtn.disabled = false;
            }
        }

        // Save as Draft
        function saveDraft() {
            const draft = {
                to: document.getElementById('recipientEmail').value,
                cc: document.getElementById('ccEmail').value,
                bcc: document.getElementById('bccEmail').value,
                subject: document.getElementById('emailSubject').value,
                body: document.getElementById('emailBody').value,
                priority: document.getElementById('priority').value,
                timestamp: new Date().toISOString()
            };

            if (!draft.subject && !draft.body) {
                showStatus('❌ Nothing to save', 'error');
                return;
            }

            let drafts = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
            drafts.push(draft);
            localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));

            showStatus('✅ Draft saved successfully!', 'success');
        }

        // Load Drafts
        function loadDrafts() {
            const drafts = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
            const draftsList = document.getElementById('draftsList');

            if (drafts.length === 0) {
                draftsList.innerHTML = '<div style="color: #7f8c8d; padding: 20px; text-align: center;">No drafts saved yet</div>';
                return;
            }

            draftsList.innerHTML = drafts.map((draft, index) => `
                <div class="email-item" onclick="loadDraft(${index})">
                    <div class="email-avatar">📝</div>
                    <div class="email-content">
                        <h3>${draft.subject || '(No Subject)'}</h3>
                        <p>${draft.to}</p>
                    </div>
                    <div style="text-align: right;">
                        <div class="email-date">${new Date(draft.timestamp).toLocaleDateString()}</div>
                        <button class="btn btn-danger" style="margin-top: 5px; padding: 5px 10px;" onclick="deleteDraft(event, ${index})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Load Draft into form
        function loadDraft(index) {
            const drafts = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
            const draft = drafts[index];

            if (draft) {
                document.getElementById('recipientEmail').value = draft.to;
                document.getElementById('ccEmail').value = draft.cc;
                document.getElementById('bccEmail').value = draft.bcc;
                document.getElementById('emailSubject').value = draft.subject;
                document.getElementById('emailBody').value = draft.body;
                document.getElementById('priority').value = draft.priority;
                switchTab('compose');
                showStatus('📝 Draft loaded into compose form', 'info');
            }
        }

        // Delete Draft
        function deleteDraft(event, index) {
            event.stopPropagation();
            let drafts = JSON.parse(localStorage.getItem(DRAFTS_KEY)) || [];
            drafts.splice(index, 1);
            localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));
            loadDrafts();
            showStatus('✅ Draft deleted', 'success');
        }

        // Add to Sent Emails
        function addToSentEmails(email) {
            let sent = JSON.parse(localStorage.getItem(SENT_KEY)) || [];
            sent.unshift(email);
            localStorage.setItem(SENT_KEY, JSON.stringify(sent));
            loadSentEmails();
        }

        // Load Sent Emails
        function loadSentEmails() {
            const sent = JSON.parse(localStorage.getItem(SENT_KEY)) || [];
            const sentList = document.getElementById('sentList');

            if (sent.length === 0) {
                sentList.innerHTML = '<div style="color: #7f8c8d; padding: 20px; text-align: center;">No sent emails yet</div>';
                return;
            }

            sentList.innerHTML = sent.map((email, index) => `
                <div class="email-item">
                    <div class="email-avatar">${email.to.charAt(0).toUpperCase()}</div>
                    <div class="email-content">
                        <h3>${email.subject}</h3>
                        <p>To: ${email.to}</p>
                    </div>
                    <div class="email-date">${new Date(email.timestamp).toLocaleDateString()}</div>
                </div>
            `).join('');
        }

        // Clear Form
        function clearForm() {
            document.getElementById('recipientEmail').value = '';
            document.getElementById('ccEmail').value = '';
            document.getElementById('bccEmail').value = '';
            document.getElementById('emailSubject').value = '';
            document.getElementById('emailBody').value = '';
            document.getElementById('priority').value = 'Normal';
            document.getElementById('template').value = '';
        }

        // Configuration Functions
        function openSettings() {
            const config = loadConfiguration();
            document.getElementById('webhookUrl').value = config.webhookUrl || '';
            document.getElementById('apiKey').value = config.apiKey || '';
            document.getElementById('senderEmail').value = config.senderEmail || '';
            document.getElementById('timeout').value = config.timeout || 30;
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function saveConfiguration() {
            const config = {
                webhookUrl: document.getElementById('webhookUrl').value.trim(),
                apiKey: document.getElementById('apiKey').value.trim(),
                senderEmail: document.getElementById('senderEmail').value.trim(),
                timeout: parseInt(document.getElementById('timeout').value)
            };

            if (!config.webhookUrl || !config.senderEmail) {
                showStatus('❌ Please fill in required fields', 'error');
                return;
            }

            localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
            showStatus('✅ Configuration saved successfully!', 'success');
            closeModal('settingsModal');
        }

        function loadConfiguration() {
            return JSON.parse(localStorage.getItem(CONFIG_KEY)) || {
                webhookUrl: '',
                apiKey: '',
                senderEmail: '',
                timeout: 30
            };
        }

        // Test Connection
        async function testConnection() {
            const config = loadConfiguration();

            if (!config.webhookUrl) {
                showStatus('⚠️ Please configure webhook URL first', 'error');
                openSettings();
                return;
            }

            showStatus('🔄 Testing connection...', 'info');

            try {
                const response = await fetch(config.webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(config.apiKey && { 'Authorization': `Bearer ${config.apiKey}` })
                    },
                    body: JSON.stringify({
                        test: true,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    showStatus('✅ Connection successful! Power Automate webhook is responding.', 'success');
                } else {
                    showStatus(`⚠️ Webhook responded with status ${response.status}. Check configuration.`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Connection failed: ${error.message}`, 'error');
            }
        }

        // Filter Emails
        function filterEmails(filter) {
            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            // In a real application, this would filter the email list
            showStatus(`📧 Filtering emails: ${filter}`, 'info');
        }

        // Refresh Data
        function refreshData() {
            loadDrafts();
            loadSentEmails();
            showStatus('🔄 Data refreshed', 'success');
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
