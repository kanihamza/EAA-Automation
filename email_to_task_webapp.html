<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email to Task Conversion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="email"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="email"]:focus,
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-clear:hover {
            background: #e0e0e0;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            font-size: 14px;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #0c5460;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-input-label {
            display: block;
            padding: 12px;
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #666;
        }
        
        .file-input-label:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .file-list {
            margin-top: 10px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email to Task Conversion</h1>
        
        <form id="emailForm">
            <div class="form-group">
                <label for="emailAddress">Email Address *</label>
                <input type="email" id="emailAddress" name="email" required placeholder="Enter email address">
            </div>
            
            <div class="form-group">
                <label for="taskTitle">Task Title *</label>
                <input type="text" id="taskTitle" name="title" required placeholder="Enter task title">
            </div>
            
            <div class="form-group">
                <label for="taskDescription">Task Description</label>
                <textarea id="taskDescription" name="description" placeholder="Enter task description"></textarea>
            </div>
            
            <div class="form-group">
                <label for="priority">Priority</label>
                <input type="text" id="priority" name="priority" placeholder="e.g., High, Medium, Low">
            </div>
            
            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="text" id="dueDate" name="dueDate" placeholder="e.g., 2025-12-25">
            </div>
            
            <div class="form-group">
                <label for="attachments">Attachments</label>
                <div class="file-input-wrapper">
                    <label for="fileInput" class="file-input-label">
                        Click to upload files or drag and drop
                    </label>
                    <input type="file" id="fileInput" name="attachments" multiple>
                    <div class="file-list" id="fileList"></div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-submit">Convert to Task</button>
                <button type="reset" class="btn-clear">Clear Form</button>
            </div>
            
            <div id="message" class="message"></div>
        </form>
    </div>

    <script>
        // Power Automate Flow Endpoints
        const ENDPOINTS = {
            getEmails: 'id-ep-1',
            getAttachments: 'id-ep-2',
            emailToTaskSummary: 'id-ep-3',
            sendNotification: 'id-ep-4'
        };

        const CONTENT_TYPE = 'application/json';

        // File input handling
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        fileInput.addEventListener('change', function() {
            updateFileList();
        });

        function updateFileList() {
            const files = fileInput.files;
            if (files.length === 0) {
                fileList.innerHTML = '';
                return;
            }

            let fileNames = '<strong>Selected files:</strong><ul style="margin: 8px 0 0 20px;">';
            for (let file of files) {
                fileNames += `<li>${file.name} (${(file.size / 1024).toFixed(2)} KB)</li>`;
            }
            fileNames += '</ul>';
            fileList.innerHTML = fileNames;
        }

        // Form submission
        document.getElementById('emailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.querySelector('.btn-submit');
            
            try {
                // Show loading message
                messageDiv.className = 'message loading';
                messageDiv.innerHTML = '<span class="spinner"></span>Processing your request...';
                submitBtn.disabled = true;

                // Gather form data
                const formData = {
                    email: document.getElementById('emailAddress').value,
                    title: document.getElementById('taskTitle').value,
                    description: document.getElementById('taskDescription').value,
                    priority: document.getElementById('priority').value,
                    dueDate: document.getElementById('dueDate').value
                };

                // Handle attachments
                const files = fileInput.files;
                const attachments = [];
                
                if (files.length > 0) {
                    for (let file of files) {
                        const base64 = await fileToBase64(file);
                        attachments.push({
                            name: file.name,
                            content: base64,
                            size: file.size
                        });
                    }
                }

                // Step 1: Get Emails (id-ep-1)
                const emailResponse = await callPowerAutomateFlow(
                    ENDPOINTS.getEmails,
                    {
                        email: formData.email
                    }
                );

                if (!emailResponse.success) {
                    throw new Error('Failed to fetch emails');
                }

                // Step 2: Get Attachments if any (id-ep-2)
                let attachmentResponse = null;
                if (attachments.length > 0) {
                    attachmentResponse = await callPowerAutomateFlow(
                        ENDPOINTS.getAttachments,
                        {
                            attachments: attachments,
                            email: formData.email
                        }
                    );
                }

                // Step 3: Email to Task Summary (id-ep-3)
                const taskResponse = await callPowerAutomateFlow(
                    ENDPOINTS.emailToTaskSummary,
                    {
                        email: formData.email,
                        title: formData.title,
                        description: formData.description,
                        priority: formData.priority,
                        dueDate: formData.dueDate,
                        attachments: attachmentResponse ? attachmentResponse.data : []
                    }
                );

                if (!taskResponse.success) {
                    throw new Error('Failed to create task');
                }

                // Step 4: Send Notification (id-ep-4)
                const notificationResponse = await callPowerAutomateFlow(
                    ENDPOINTS.sendNotification,
                    {
                        email: formData.email,
                        taskId: taskResponse.data.taskId,
                        taskTitle: formData.title,
                        status: 'Task Created Successfully'
                    }
                );

                // Success message
                messageDiv.className = 'message success';
                messageDiv.innerHTML = `
                    ✓ Task created successfully!<br>
                    <small>Task ID: ${taskResponse.data.taskId}</small>
                `;

                // Reset form
                document.getElementById('emailForm').reset();
                fileList.innerHTML = '';

            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = `✗ Error: ${error.message}`;
                console.error('Error:', error);
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Call Power Automate Flow
        async function callPowerAutomateFlow(endpoint, payload) {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': CONTENT_TYPE
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                return {
                    success: true,
                    data: data
                };

            } catch (error) {
                console.error(`Error calling ${endpoint}:`, error);
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        // Convert file to Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    resolve(reader.result);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Drag and drop functionality
        const fileInputWrapper = document.querySelector('.file-input-wrapper');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileInputWrapper.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            fileInputWrapper.addEventListener(eventName, () => {
                document.querySelector('.file-input-label').style.borderColor = '#667eea';
                document.querySelector('.file-input-label').style.background = '#f0f4ff';
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileInputWrapper.addEventListener(eventName, () => {
                document.querySelector('.file-input-label').style.borderColor = '#ddd';
                document.querySelector('.file-input-label').style.background = '#f8f9fa';
            });
        });

        fileInputWrapper.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            updateFileList();
        });
    </script>
</body>
</html>
